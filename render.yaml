services:
  - type: web
    name: resumedoc-api
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: resumedoc-files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resumedoc-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: resumedoc-redis
          type: keyvalue
          property: connectionString
      - key: STORAGE_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: "1800"
      - key: JWT_REFRESH_TTL
        value: "604800"
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: MAX_PDF_PAGES
        value: "100"
      - key: PROCESS_TIMEOUT_S
        value: "300"
      - key: OCR_LANG
        value: spa
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        fromService:
          name: resumedoc-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: keyvalue
    name: resumedoc-redis
    plan: 256mb
    region: ohio
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  - type: web
    name: resumedoc-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace @resumedoc/web
    staticPublishPath: ./apps/web/dist
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
    envVars:
      - key: VITE_USE_MOCK_AUTH
        value: "false"
      - key: VITE_USE_MOCK_SUMMARY
        value: "false"
      - key: VITE_API_URL
        fromService:
          name: resumedoc-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: resumedoc-db
    plan: free
    region: ohio
    postgresMajorVersion: "17"
    databaseName: resumedoc
    user: resumedoc
